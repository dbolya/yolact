# Lightweight conda environment for YOLACT.
#
# Note: this environment does not try to pin CUDA / PyTorch builds. Install a
# system-appropriate `torch` / `torchvision` first (CUDA vs CPU), then install
# this repo as a package.
name: yolact-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.12
  - pip
  - git   # to download COCO dataset
  - curl  # to download COCO dataset
  - unzip # to download COCO dataset
  - conda-forge::bash # to download COCO dataset
  - pip:
    - -e .
